<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Easy Saver — We'll be right back</title>
<style>
  :root{
    --bg1:#0b1020; --bg2:#141a33; --card:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.12); --fg:#eef2ff; --muted:#9aa6c7;
    --accent:#6d8bff; --accent2:#8b5cf6; --good:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--fg);
    background:radial-gradient(1200px 800px at 20% -10%,#1b2350 0%,transparent 60%),
               radial-gradient(1000px 700px at 110% 20%,#2a1a4d 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100dvh;display:grid;place-items:center;padding:24px;overflow:hidden;position:relative;
  }
  /* floating ambient orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
  .orb.a{width:340px;height:340px;background:#4f6bff;top:-80px;left:-60px}
  .orb.b{width:300px;height:300px;background:#8b5cf6;bottom:-90px;right:-70px;animation-delay:-5s}
  .orb.c{width:200px;height:200px;background:#22d3ee;top:40%;right:15%;opacity:.25;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.08)}}

  .card{
    position:relative;z-index:1;width:min(560px,92vw);text-align:center;
    background:var(--card);border:1px solid var(--stroke);border-radius:28px;
    padding:48px 34px 40px;backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  /* animated logo mark */
  .mark{width:104px;height:104px;margin:0 auto 26px;position:relative;display:grid;place-items:center}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;
    border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1.8s linear infinite}
  .ring.two{inset:12px;border-top-color:var(--good);border-right-color:transparent;animation-duration:2.6s;animation-direction:reverse;opacity:.7}
  @keyframes spin{to{transform:rotate(360deg)}}
  .arrow{width:44px;height:44px;color:var(--fg);animation:bob 1.9s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}

  h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--muted);font-size:clamp(15px,2.6vw,17px);line-height:1.6;max-width:42ch;margin:0 auto}

  .status{display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding:9px 16px;
    border:1px solid var(--stroke);border-radius:999px;background:rgba(255,255,255,.04);font-size:14px;color:var(--fg)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  /* progress shimmer */
  .bar{margin:26px auto 4px;height:6px;width:78%;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{display:block;height:100%;width:40%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.7s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

  .foot{margin-top:26px;font-size:13px;color:var(--muted)}
  .retry{margin-top:20px;display:inline-block;padding:12px 22px;border-radius:14px;font-weight:600;font-size:15px;
    color:#fff;text-decoration:none;border:1px solid var(--stroke);
    background:linear-gradient(90deg,var(--accent),var(--accent2));cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .retry:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(109,139,255,.35)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <main class="card">
    <div class="mark">
      <span class="ring"></span><span class="ring two"></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </div>

    <h1>We'll be right <span class="grad">back</span></h1>
    <p>Easy Saver is doing a quick tune-up. Downloads will be ready again in a moment — thanks for your patience.</p>

    <div class="bar"><i></i></div>

    <div class="status"><span class="dot"></span> Reconnecting to the server…</div>

    <div><a class="retry" onclick="location.reload()">Try again</a></div>

    <div class="foot">Easy Saver — free video &amp; MP3 downloader</div>
  </main>

  <script>
    // Auto-retry: quietly reload every 20s in case the service is back.
    setTimeout(function(){ location.reload(); }, 20000);
  </script>
</body>
</html>
